# Drop-in del sender dei bandi (contratto `bandi-giro-2` §10 e §11).
# Percorso: /etc/systemd/system/edunews-bandi-sender.service.d/riavvio.conf
#
# - Restart=on-failure e RestartSec=20min: dopo un errore fatale dello
#   scheduler il sender esce con 1 (`backend/app/bandi_sender.py`) e systemd
#   lo riavvia dopo 20 minuti, non subito. Prima usciva con 0 e restava giu'.
# - StartLimitIntervalSec=0: systemd non smette mai di riprovare. I riavvii
#   ripetuti li vede `sorveglia` (codice `riavvii_ripetuti`, sul pannello).
# - Se il processo precedente e' morto a meta' giro (il lock del giro era suo),
#   il sender NON rifa' il giro di boot: scrive una riga `riavvio_dopo_crash`
#   in `pipeline_run` e aspetta il prossimo giro dello scheduler. Cosi' un giro
#   che fa cadere il processo non diventa un ciclo di riavvii.
#
# Installazione, una volta sola (RIPRESA §1, «Giro 2»):
#   sudo mkdir -p /etc/systemd/system/edunews-bandi-sender.service.d
#   sudo cp edunews-bandi-sender-riavvio.conf \
#     /etc/systemd/system/edunews-bandi-sender.service.d/riavvio.conf
#   sudo systemctl daemon-reload
# poi UN SOLO `sudo systemctl restart edunews-bandi-sender`, nella finestra
# sicura (12:30-16:30 o 19:00-22:30), e l'attesa di «Pipeline iniziale
# completata» nel journal. Verifica:
#   systemctl show edunews-bandi-sender \
#     -p Restart,RestartUSec,StartLimitIntervalUSec

[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=20min
